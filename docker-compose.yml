services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/dekoservice.alxple.com
    command: sh -c "mkdir -p /tmp/build_volume && cp -a /var/www/dekoservice.alxple.com/public/build/* /tmp/build_volume/ 2>/dev/null || true; chmod -R 755 /tmp/build_volume; php-fpm"
    volumes:
      - ./app/.env:/var/www/dekoservice.alxple.com/.env
      - ./app/storage:/var/www/dekoservice.alxple.com/storage
      - public_build:/tmp/build_volume
    depends_on:
      - db
      - redis

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./app/public:/var/www/dekoservice.alxple.com/public
      - ./app/storage:/var/www/dekoservice.alxple.com/storage:ro
      - public_build:/var/www/dekoservice.alxple.com/public/build:ro
      - ./app/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  queue:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/dekoservice.alxple.com
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./app/.env:/var/www/dekoservice.alxple.com/.env
      - ./app/storage:/var/www/dekoservice.alxple.com/storage
    depends_on:
      - app
      - db
      - redis

  scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/dekoservice.alxple.com
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./app/.env:/var/www/dekoservice.alxple.com/.env
      - ./app/storage:/var/www/dekoservice.alxple.com/storage
    depends_on:
      - app
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dekoservice
      POSTGRES_USER: dekoservice
      POSTGRES_PASSWORD: change_me
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pg_data:
  public_build:
